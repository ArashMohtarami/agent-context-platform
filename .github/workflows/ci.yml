name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_ALLOW_DOWNLOADS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            docs/guide/requirements.txt
      - name: Install pinned CPU dependencies and documentation builder
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.lock -r docs/guide/requirements.txt
          python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Python checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy app
      - name: Build reviewed static documentation
        run: python website/build.py
      - name: Verify rebuilt guide and extracted source/site contracts
        run: python -m pytest tests/documentation -q
      - name: Check public release inventory
        run: python scripts/prepare_open_source_release.py --check

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix dashboard ci
      - name: Check frontend contracts and components
        run: |
          npm --prefix dashboard run lint
          npm --prefix dashboard run typecheck
          npm --prefix dashboard run test:unit
          npm --prefix dashboard run licenses
          git diff --exit-code -- dashboard/dependency-licenses.json dashboard/THIRD_PARTY_NOTICES.txt
          npm --prefix dashboard run build
      - name: Build pinned static TLS distribution image
        run: docker build --target console -t acp-console:ci .
      - name: Audit extracted source and reproduce the frontend build
        run: |
          python scripts/prepare_open_source_release.py --output /tmp/acp-source.tar.gz
          mkdir /tmp/acp-source
          tar -xzf /tmp/acp-source.tar.gz -C /tmp/acp-source
          python /tmp/acp-source/agent-context-platform/scripts/prepare_open_source_release.py --check
          npm --prefix /tmp/acp-source/agent-context-platform/dashboard ci --ignore-scripts --no-audit --no-fund
          npm --prefix /tmp/acp-source/agent-context-platform/dashboard run licenses
          npm --prefix /tmp/acp-source/agent-context-platform/dashboard run build
