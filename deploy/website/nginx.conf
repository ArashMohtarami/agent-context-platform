server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    # The complete guide embeds its scripts and styles so it also works offline.
    # Everything is local; neither this page nor the guide calls the live API.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;

    location ~ (^|/)\. {
        return 404;
    }

    location = /LICENSE {
        default_type text/plain;
    }

    location ~ \.(md|py|sh|toml|yaml|yml|lock|txt|conf)$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
